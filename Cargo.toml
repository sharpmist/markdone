[package]
name = "markdone"
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.89"
description = "t: personal todo lists kept as Markdown files"
license-file = "LICENSE"
repository = "https://github.com/sharpmist/markdone"
publish = false

[[bin]]
name = "t"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
